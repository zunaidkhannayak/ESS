<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>MOIL ESS</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f4f8;--sf:#fff;--tx:#17212f;--mu:#5b6779;--hd:#12315c;--pr:#12315c;--ac:#b85c00;--ln:#d6dce7;--ok:#1d7a46;--bad:#b3261e;--wa:#8a5a00;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1420;--sf:#171f2d;--tx:#e8edf5;--mu:#9aa6b8;--hd:#1d3f73;--pr:#8db4f0;--ac:#f0a050;--ln:#2a3548;--ok:#5cc88a;--bad:#ff8a80;--wa:#e6b95c}}
:root[data-theme=dark]{--bg:#0e1420;--sf:#171f2d;--tx:#e8edf5;--mu:#9aa6b8;--hd:#1d3f73;--pr:#8db4f0;--ac:#f0a050;--ln:#2a3548;--ok:#5cc88a;--bad:#ff8a80;--wa:#e6b95c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 'Noto Sans',system-ui,sans-serif}
header{background:var(--hd);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}header b{font-size:19px;letter-spacing:.3px}header span.s{flex:1;font-size:13px;opacity:.85}
.sample{background:#fff3d6;color:#5c3d00;padding:6px 16px;font-size:13px;border-bottom:2px solid var(--ac)}
.lay{display:flex;min-height:calc(100vh - 90px)}nav{width:200px;background:var(--sf);border-right:1px solid var(--ln);padding:8px;flex:none}
nav button{display:block;width:100%;text-align:left;background:none;border:0;padding:10px 12px;border-radius:6px;color:var(--tx);font:inherit;cursor:pointer}nav button:hover{background:var(--bg)}nav button.on{background:var(--hd);color:#fff;font-weight:600}
main{flex:1;padding:18px;min-width:0;max-width:1000px}h2{margin:0 0 12px;font-size:21px}h3{margin:18px 0 8px;font-size:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.tile{background:var(--sf);border:1px solid var(--ln);border-left:5px solid var(--ac);border-radius:6px;padding:14px;text-align:left;font:inherit;color:var(--tx);cursor:pointer;position:relative}.tile:hover{border-color:var(--pr)}.tile b{display:block;font-size:16px}.tile small{color:var(--mu)}
.badge{position:absolute;top:10px;right:10px;background:var(--bad);color:#fff;border-radius:10px;font-size:12px;padding:0 7px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:6px;padding:14px;margin-bottom:12px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;background:var(--sf)}th,td{padding:8px 10px;border-bottom:1px solid var(--ln);text-align:left;font-size:14px;white-space:nowrap}th{background:var(--bg);color:var(--mu);font-weight:600}
input,select,textarea{font:inherit;padding:8px;border:1px solid var(--ln);border-radius:6px;background:var(--sf);color:var(--tx);width:100%}label{display:block;font-size:13px;color:var(--mu);margin:8px 0 3px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:0 12px}
button.b{background:var(--hd);color:#fff;border:0;border-radius:6px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer;margin:10px 6px 0 0}button.b.g{background:none;color:var(--pr);border:1px solid var(--pr)}button.b.r{background:var(--bad)}button.b.sm{padding:4px 10px;margin:0 4px 0 0}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--ac);outline-offset:1px}
.st{padding:1px 8px;border-radius:10px;font-size:12px;font-weight:600;border:1px solid currentColor}.Approved,.Present{color:var(--ok)}.Rejected,.Missing{color:var(--bad)}.Pending,.Late{color:var(--wa)}
.tag{font-size:11px;background:#fff3d6;color:#5c3d00;padding:0 6px;border-radius:4px;margin-left:6px}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px}.kv dt{color:var(--mu)}.kv dd{margin:0;font-weight:600}
.login{max-width:400px;margin:6vh auto;padding:0 14px}.mu{color:var(--mu);font-size:13px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:8px;display:none;z-index:9;max-width:90vw}
.ov{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;z-index:8;padding:14px}.ov .card{max-width:600px;width:100%;max-height:85vh;overflow:auto}
#print{display:none;background:#fff;color:#000;padding:20px}#print table{color:#000;background:#fff}
@media(max-width:760px){.lay{flex-direction:column}nav{width:auto;display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid var(--ln)}nav button{white-space:nowrap;width:auto}main{padding:12px}.kv{grid-template-columns:110px 1fr}}
@media print{body>*:not(#print){display:none!important}#print{display:block!important}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><div id="app"></div><div id="print"></div><div id="toast" role="status"></div>
<script>
const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],$=s=>document.querySelector(s);
const p2=n=>String(n).padStart(2,'0'),iso=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const fmt=n=>'₹'+Number(n).toLocaleString('en-IN'),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hm=m=>m==null?'—':p2(Math.floor(m/60))+':'+p2(m%60),pm=t=>{const[a,b]=t.split(':');return+a*60+ +b};
const h=s=>{let x=2166136261;for(const c of s){x^=c.charCodeAt(0);x=Math.imul(x,16777619)}return x>>>0};
const TODAY=new Date();TODAY.setHours(0,0,0,0);const TK=iso(TODAY),KEY='moil_ess_sample_v2';
const LT={CL:'Casual Leave',EL:'Earned Leave',HPL:'Half Pay Leave',SL:'Sick Leave'};
/* ---- Data layer: replace these functions with authorised HRMS / payroll / biometric / DMS API calls ---- */
function mkSlip(emp,y,m,b,src,o={}){const da=o.da??Math.round(b*.4),hra=o.hra??Math.round(b*.12),oa=o.oa??5400;return{emp,y,m,basic:b,level:o.level||(b>60000?'Level 10':'Level 6'),da,hra,oa,pf:o.pf??Math.round(b*.12),tax:o.tax??Math.round((b+da+hra+oa)*(b>60000?.07:.02)),od:o.od??508,src}}
function seed(){const U=(id,name,desig,dept,unit,role,rep,basic,dob)=>({id,name,desig,dept,unit,role,rep,basic,dob,pw:'Demo@123',active:true,doj:'2012-07-01'});
const users=[U('E1001','Zunaid Khan Nayak','Manager (Electrical)','Electrical','Balaghat Mine','employee','E1002',95000,'1988-03-14'),U('E1002','Sunita Deshmukh','Deputy Manager','Mining','Balaghat Mine','officer',null,78000,'1984-09-02'),U('E1003','Mohan Lal Yadav','Electrician Gr. II','Electrical','Balaghat Mine','employee','E1002',38000,'1990-12-21'),U('HR01','Priya Nair','Senior Officer (HR)','Human Resources','Head Office, Nagpur','admin',null,72000,'1986-05-30')];
const policy={CL:8,EL:30,HPL:20,SL:12},bal={},slips=[];
users.forEach(u=>{bal[u.id]={...policy};let d=new Date(2025,3,1);while(d<new Date(TODAY.getFullYear(),TODAY.getMonth(),1)){slips.push(mkSlip(u.id,d.getFullYear(),d.getMonth(),u.basic,'sample'));d=new Date(d.getFullYear(),d.getMonth()+1,1)}});
const O=(id,title,subject,cat,unit,date,body)=>({id,title,subject,cat,unit,date,body,src:'sample'});
return{users,policy,bal,slips,leaves:[{id:'L1',emp:'E1001',type:'CL',from:'2026-10-05',to:'2026-10-06',days:2,reason:'Family function',doc:'',status:'Approved',applied:'2026-10-01',by:'E1002'}],corr:[],fix:{},notifs:[],logs:[],
orders:[O('O1','Revised shift timings for underground staff','Office Order','Mines','Balaghat Mine','2026-11-10','Sample text: revised shift timings come into effect from the first of next month. Replace with the official document.'),O('O2','Annual medical examination schedule','Circular','Head Office','Nagpur','2026-11-05','Sample text: annual medical examination schedule for all executives and non-executives.'),O('O3','Safety week observance guidelines','Circular','Mines','All mines','2026-10-20','Sample text: guidelines for observing the safety week at mines.'),O('O4','Leave encashment procedure','HR Policy','Units','All units','2026-09-15','Sample text: procedure to apply for leave encashment through ESS.')]}}
let D=(()=>{try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}return seed()})();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}};
const S={u:null,v:'home',ay:TODAY.getFullYear(),am:TODAY.getMonth(),fy:null,sm:null,q:'',cat:'All',modal:null};
const me=()=>D.users.find(u=>u.id==S.u),usr=id=>D.users.find(u=>u.id==id)||{name:id};
const log=t=>{D.logs.unshift({t:new Date().toLocaleString('en-IN'),by:S.u,txt:t});save()};
function notify(to,text,key){const t=to=='all'?D.users.filter(u=>u.active).map(u=>u.id):[to];t.forEach(id=>{if(key&&D.notifs.some(n=>n.key==key&&n.to==id))return;D.notifs.unshift({id:'N'+Date.now()+id+Math.random(),to:id,text,date:TK,read:false,key})})}
const dd=(a,b)=>Math.round((new Date(b+'T00:00')-new Date(a+'T00:00'))/864e5)+1;
const taken=(id,t,st='Approved')=>D.leaves.filter(l=>l.emp==id&&l.type==t&&l.status==st).reduce((s,l)=>s+l.days,0);
const avail=(id,t)=>(D.bal[id]?.[t]||0)-taken(id,t)-taken(id,t,'Pending');
function attDay(id,d){const k=iso(d),fx=D.fix[id+k];if(d.getDay()==0)return{k,st:'Weekly off'};
const lv=D.leaves.find(l=>l.emp==id&&l.status=='Approved'&&k>=l.from&&k<=l.to);if(lv)return{k,st:'Leave ('+lv.type+')'};
const r=h(id+k)%100;let a=525+h(k+id+'i')%20,b=1050+h(k+id+'o')%40;
if(r<5)b=null;else if(r<8)a=null;else if(r<20)a=556+h(k+id+'l')%40;else if(r<27)b=965+h(k+id+'e')%50;
if(fx){a=fx.in;b=fx.out}if(k==TK&&!fx)b=null;
let st='Present';if(k==TK&&b==null)st='In progress';else if(a==null||b==null)st='Missing punch';else if(a>555)st='Late arrival';else if(b<1020)st='Early departure';
return{k,a,b,st,fixed:!!fx}}
const monthAtt=(id,y,m)=>{const o=[];for(let d=new Date(y,m,1);d.getMonth()==m&&d<=TODAY;d=new Date(y,m,d.getDate()+1))o.push(attDay(id,d));return o};
function sync(id){for(let i=1;i<=7;i++){const d=new Date(TODAY);d.setDate(d.getDate()-i);const a=attDay(id,d);if(a.st=='Missing punch')notify(id,`Missing biometric punch on ${a.k}. Raise a correction request.`,'mp'+a.k);else if(a.st!='Present'&&a.a!=null&&(a.st=='Late arrival'||a.st=='Early departure'))notify(id,`Attendance discrepancy on ${a.k}: ${a.st}.`,'ad'+a.k)}
D.slips.filter(s=>s.emp==id).slice(-1).forEach(s=>notify(id,`Salary slip for ${MN[s.m]} ${s.y} is available.`,'sl'+s.y+s.m));save()}
/* ---- UI helpers ---- */
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',3200)};
const fd=e=>{e.preventDefault();return Object.fromEntries(new FormData(e.target))};
const tr=c=>'<tr>'+c.map(x=>'<td>'+x+'</td>').join('')+'</tr>';
const tbl=(hd,rows)=>`<div class=tw><table><tr>${hd.map(x=>'<th>'+x+'</th>').join('')}</tr>${rows.join('')||`<tr><td colspan=${hd.length}>Nothing here yet.</td></tr>`}</table></div>`;
const chip=s=>`<span class="st ${s.split(' ')[0]}">${s}</span>`,tag=s=>s=='sample'?'<span class=tag>Sample</span>':'<span class=tag>Entered here, unverified</span>';
const go=v=>{S.v=v;S.modal=null;render()},pr=html=>{$('#print').innerHTML=html;window.print()};
const ml=(y,m)=>MN[m]+' '+y,fyOf=s=>s.m>=3?s.y:s.y-1;
const NAV={employee:[['home','Dashboard'],['profile','My Profile'],['slip','Salary Slip'],['leave','Leave'],['att','Attendance'],['hist','Leave & Attendance History'],['notif','Notifications'],['orders','Orders & Circulars']]};
NAV.officer=[...NAV.employee,['appr','Leave Approvals']];
NAV.admin=[['ahome','Admin Home'],['aemp','Employees & Permissions'],['aslip','Upload Salary Slip'],['aleave','Leave Policy & Balances'],['acorr','Attendance Corrections'],['aord','Upload Order / Circular'],['anot','Send Notification'],['alog','Activity Log'],['orders','Orders & Circulars'],['profile','My Profile']];
const ADM=['ahome','aemp','aslip','aleave','acorr','aord','anot','alog'];
function render(){const a=$('#app');if(!S.u){a.innerHTML=loginView();return}
const u=me(),n=NAV[u.role];if(ADM.includes(S.v)&&u.role!='admin')S.v='home';if(u.role=='admin'&&S.v=='home')S.v='ahome';if(S.v=='appr'&&u.role!='officer')S.v='home';
a.innerHTML=`<header><b>MOIL ESS</b><span class=s>${esc(u.name)} · ${esc(u.desig)} · ${esc(u.dept)} · ${esc(u.unit)} · ID ${u.id}</span><button class="b g sm" style="color:#fff;border-color:#fff;margin:0" onclick="logout()">Log out</button></header>
<div class=sample><b>Sample data.</b> Every record here is invented for testing. Nothing is verified live employee data from MOIL systems.</div>
<div class=lay><nav aria-label="Main">${n.map(([k,l])=>`<button class="${S.v==k?'on':''}" onclick="go('${k}')">${l}</button>`).join('')}</nav><main>${V[S.v]()}</main></div>${S.modal||''}`}
/* ---- Auth ---- */
function loginView(){const reset=S.reset;return`<div class=login><div class=card><h2>MOIL ESS</h2><p class=mu>MOIL Limited · Employee Self-Service</p>${reset?`<form onsubmit="doReset(event)"><label>Employee ID</label><input name=id required><label>Date of birth (verification)</label><input type=date name=dob required><label>New password (8+ characters, one number)</label><input type=password name=pw required minlength=8><button class=b>Reset password</button><button type=button class="b g" onclick="S.reset=0;render()">Back to login</button></form>`:`<form onsubmit="doLogin(event)"><label>Employee ID</label><input name=id required autocomplete=username><label>Password</label><input type=password name=pw required autocomplete=current-password><button class=b>Log in</button><button type=button class="b g" onclick="S.reset=1;render()">Forgot password</button></form>`}</div>
<div class=card><b>Test accounts</b> (password <code>Demo@123</code>)<p class=mu>E1001 Employee · E1002 Reporting officer · E1003 Employee · HR01 HR administrator. Reset verification uses the sample date of birth, for example E1001 is 1988-03-14.</p><p class=mu>This prototype stores data in your browser only. Real authentication, hashing and access control must run on MOIL's server.</p></div></div>`}
function doLogin(e){const f=fd(e),u=D.users.find(x=>x.id==f.id.trim().toUpperCase());if(!u||u.pw!=f.pw)return toast('Employee ID or password is incorrect.');if(!u.active)return toast('This account is disabled. Contact HR.');S.u=u.id;S.v=u.role=='admin'?'ahome':'home';sync(u.id);render()}
function logout(){S.u=null;render()}
function doReset(e){const f=fd(e),u=D.users.find(x=>x.id==f.id.trim().toUpperCase());if(!u||u.dob!=f.dob)return toast('Employee ID and date of birth do not match.');if(!/\d/.test(f.pw))return toast('Password needs at least one number.');u.pw=f.pw;save();S.reset=0;toast('Password reset. Log in with the new password.');render()}
/* ---- Views ---- */
const V={};
V.home=()=>{const u=me(),un=D.notifs.filter(n=>n.to==u.id&&!n.read).length,pend=D.leaves.filter(l=>usr(l.emp).rep==u.id&&l.status=='Pending').length,new_=D.orders.filter(o=>(TODAY-new Date(o.date))/864e5<=14).length;
const T=(v,t,s,b)=>`<button class=tile onclick="go('${v}')"><b>${t}</b><small>${s}</small>${b?`<span class=badge>${b}</span>`:''}</button>`;
return`<h2>Welcome, ${esc(u.name.split(' ')[0])}</h2><div class=grid>${T('profile','My Profile','Employment details')}${T('slip','Online Salary Slip','View and download')}${T('leave','Leave Application','Apply and track')}${T('att','Biometric Attendance','Punches and corrections')}${T('hist','Leave & Attendance History','Reports')}${T('notif','Notifications & Alerts','Unread: '+un,un)}${T('orders','Office Orders & Circulars','New in last 14 days: '+new_,new_)}${u.role=='officer'?T('appr','Leave Approvals','Pending: '+pend,pend):''}</div><h3>Latest circulars</h3>${tbl(['Date','Title','Category'],D.orders.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,3).map(o=>tr([o.date,esc(o.title),o.cat])))}`};
V.profile=()=>{const u=me();return`<h2>My Profile</h2><div class=card><dl class=kv><dt>Name<dd>${esc(u.name)}<dt>Employee ID<dd>${u.id}<dt>Designation<dd>${esc(u.desig)}<dt>Department<dd>${esc(u.dept)}<dt>Unit<dd>${esc(u.unit)}<dt>Date of joining<dd>${u.doj}<dt>Reporting officer<dd>${u.rep?esc(usr(u.rep).name):'—'}<dt>Access role<dd>${u.role}</dl></div><p class=mu>You can only see your own records.</p>`};
function slipHTML(s){const u=usr(s.emp),g=s.basic+s.da+s.hra+s.oa,d=s.pf+s.tax+s.od;return`<h3>MOIL Limited · Pay slip for ${ml(s.y,s.m)}</h3><p>${esc(u.name)} · ${u.id} · ${esc(u.desig)} · ${esc(u.dept)}, ${esc(u.unit)}</p><table><tr><th colspan=2>Earnings<th colspan=2>Deductions</tr>${tr(['Basic pay ('+s.level+')',fmt(s.basic),'Provident fund',fmt(s.pf)])}${tr(['Dearness allowance',fmt(s.da),'Income tax',fmt(s.tax)])}${tr(['House rent allowance',fmt(s.hra),'Other deductions',fmt(s.od)])}${tr(['Other allowances',fmt(s.oa),'',''])}${tr(['<b>Gross salary</b>','<b>'+fmt(g)+'</b>','<b>Total deductions</b>','<b>'+fmt(d)+'</b>'])}</table><h3>Net salary: ${fmt(g-d)}</h3><p class=mu>${s.src=='sample'?'SAMPLE DATA – not a real pay slip.':'Entered in prototype – unverified.'}</p>`}
V.slip=()=>{const u=me(),all=D.slips.filter(s=>s.emp==u.id).sort((a,b)=>(b.y*12+b.m)-(a.y*12+a.m));const fys=[...new Set(all.map(fyOf))];if(S.fy==null)S.fy=fys[0];const inFy=all.filter(s=>fyOf(s)==S.fy);if(!inFy.some(s=>s.m==S.sm))S.sm=inFy[0]?.m;const cur=inFy.find(s=>s.m==S.sm);
return`<h2>Online Salary Slip</h2><div class=card><div class=row><div><label>Financial year</label><select onchange="S.fy=+this.value;render()">${fys.map(f=>`<option value=${f} ${f==S.fy?'selected':''}>${f}-${String(f+1).slice(2)}</option>`).join('')}</select></div><div><label>Month</label><select onchange="S.sm=+this.value;render()">${inFy.map(s=>`<option value=${s.m} ${s.m==S.sm?'selected':''}>${MN[s.m]} ${s.y}</option>`).join('')}</select></div></div></div>${cur?`<div class=card>${slipHTML(cur)}<button class=b onclick="pr(slipHTML(D.slips.find(s=>s.emp=='${u.id}'&&s.y==${cur.y}&&s.m==${cur.m})))">Download PDF</button><p class=mu>Opens your print dialog. Choose "Save as PDF".</p></div>`:'<p>No salary slip for this selection.</p>'}<h3>Salary slip history</h3>${tbl(['Month','Gross','Net','Source'],all.map(s=>{const g=s.basic+s.da+s.hra+s.oa;return tr([ml(s.y,s.m),fmt(g),fmt(g-s.pf-s.tax-s.od),tag(s.src)])}))}`};
V.leave=()=>{const u=me(),mine=D.leaves.filter(l=>l.emp==u.id).sort((a,b)=>b.applied.localeCompare(a.applied));
return`<h2>Leave Application</h2><div class=grid>${Object.keys(LT).map(t=>`<div class=card><b>${LT[t]}</b><br>Available: <b>${avail(u.id,t)}</b> of ${D.bal[u.id]?.[t]||0} days</div>`).join('')}</div><div class=card><h3 style=margin-top:0>New application</h3><form onsubmit="applyLeave(event)"><div class=row><div><label>Leave type</label><select name=type>${Object.keys(LT).map(t=>`<option value=${t}>${LT[t]}</option>`).join('')}</select></div><div><label>Start date</label><input type=date name=from required></div><div><label>End date</label><input type=date name=to required></div></div><label>Reason</label><textarea name=reason required rows=2></textarea><label>Supporting document (optional)</label><input type=file name=doc><button class=b>Submit application</button></form></div><h3>Application history</h3>${tbl(['Applied','Type','From','To','Days','Status','Reason',''],mine.map(l=>tr([l.applied,LT[l.type],l.from,l.to,l.days,chip(l.status),esc(l.reason),l.status=='Pending'?`<button class="b sm r" onclick="cancelLeave('${l.id}')">Withdraw</button>`:''])))}`};
function applyLeave(e){const f=fd(e),u=me(),days=dd(f.from,f.to);if(days<1)return toast('End date must be on or after the start date.');if(days>avail(u.id,f.type))return toast(`Only ${avail(u.id,f.type)} day(s) of ${LT[f.type]} available.`);
if(D.leaves.some(l=>l.emp==u.id&&l.status!='Rejected'&&f.from<=l.to&&f.to>=l.from))return toast('These dates overlap an existing application.');
D.leaves.push({id:'L'+Date.now(),emp:u.id,type:f.type,from:f.from,to:f.to,days,reason:f.reason,doc:f.doc?.name||'',status:'Pending',applied:TK,by:null});if(u.rep)notify(u.rep,`${u.name} applied for ${days} day(s) of ${LT[f.type]} (${f.from} to ${f.to}).`);save();toast('Leave application submitted.');render()}
function cancelLeave(id){D.leaves=D.leaves.filter(l=>l.id!=id);save();render()}
V.appr=()=>{const u=me(),L=D.leaves.filter(l=>usr(l.emp).rep==u.id).sort((a,b)=>b.applied.localeCompare(a.applied));return`<h2>Leave Approvals</h2>${tbl(['Employee','Type','From','To','Days','Reason','Status',''],L.map(l=>tr([esc(usr(l.emp).name),LT[l.type],l.from,l.to,l.days,esc(l.reason),chip(l.status),l.status=='Pending'?`<button class="b sm" onclick="decide('${l.id}','Approved')">Approve</button><button class="b sm r" onclick="decide('${l.id}','Rejected')">Reject</button>`:'']) ))}`};
function decide(id,st){const l=D.leaves.find(x=>x.id==id);l.status=st;l.by=S.u;notify(l.emp,`Your ${LT[l.type]} (${l.from} to ${l.to}) was ${st.toLowerCase()}.`);if(st=='Approved')notify(l.emp,`Leave balance updated: ${LT[l.type]} now ${avail(l.emp,l.type)} day(s).`);save();render()}
V.att=()=>{const u=me(),A=monthAtt(u.id,S.ay,S.am),c=k=>A.filter(a=>a.st.startsWith(k)).length,bad=A.filter(a=>a.st=='Missing punch'),mc=D.corr.filter(x=>x.emp==u.id);
return`<h2>Biometric Attendance</h2><div class=card><button class="b g sm" onclick="mon(-1)">◀ Previous</button> <b>${ml(S.ay,S.am)}</b> <button class="b g sm" onclick="mon(1)">Next ▶</button><p>Present ${c('Present')+c('Late')+c('Early')} · Late arrivals ${c('Late')} · Early departures ${c('Early')} · Missing punches ${c('Missing')} · Leave ${c('Leave')} · Weekly off ${c('Weekly')}</p><p class=mu>Shift 09:00–17:30. Late after 09:15, early before 17:00. Sample punches.</p></div>${tbl(['Date','IN','OUT','Status'],A.map(a=>tr([a.k,hm(a.a),hm(a.b),chip(a.st)+(a.fixed?' <span class=tag>Corrected</span>':'')])))}
<div class=card><h3 style=margin-top:0>Raise a correction request</h3><form onsubmit="reqFix(event)"><div class=row><div><label>Date</label><input type=date name=date required max="${TK}"></div><div><label>IN time</label><input type=time name=in required></div><div><label>OUT time</label><input type=time name=out required></div></div><label>Reason</label><input name=reason required><button class=b>Send to HR</button></form></div><h3>My correction requests</h3>${tbl(['Date','IN','OUT','Reason','Status'],mc.map(x=>tr([x.date,x.in,x.out,esc(x.reason),chip(x.status)])))}`};
const mon=d=>{const x=new Date(S.ay,S.am+d,1);S.ay=x.getFullYear();S.am=x.getMonth();render()};
function reqFix(e){const f=fd(e);D.corr.push({id:'C'+Date.now(),emp:S.u,...f,status:'Pending'});notify(D.users.find(u=>u.role=='admin').id,`${me().name} requested an attendance correction for ${f.date}.`);save();toast('Correction request sent.');render()}
V.hist=()=>{const u=me(),mine=D.leaves.filter(l=>l.emp==u.id),rows=[];for(let i=0;i<6;i++){const d=new Date(TODAY.getFullYear(),TODAY.getMonth()-i,1),A=monthAtt(u.id,d.getFullYear(),d.getMonth());rows.push(tr([ml(d.getFullYear(),d.getMonth()),A.filter(a=>/^(Present|Late|Early)/.test(a.st)).length,A.filter(a=>a.st.startsWith('Leave')).length,A.filter(a=>a.st=='Late arrival').length,A.filter(a=>a.st=='Early departure').length,A.filter(a=>a.st=='Missing punch').length]))}
const bal=tbl(['Leave type','Sanctioned (entitlement)','Taken','Pending','Balance'],Object.keys(LT).map(t=>tr([LT[t],D.bal[u.id]?.[t]||0,taken(u.id,t),taken(u.id,t,'Pending'),avail(u.id,t)]))),att=tbl(['Month','Days present','Leave days','Late','Early','Missing punches'],rows),lv=tbl(['Applied','Type','From','To','Days','Status'],mine.map(l=>tr([l.applied,LT[l.type],l.from,l.to,l.days,l.status])));
S.rep=`<h3>Leave and attendance report: ${esc(u.name)} (${u.id})</h3><p>Sample data.</p>${bal}${att}${lv}`;
return`<h2>Leave & Attendance History</h2><h3>Leave balance</h3>${bal}<h3>Monthly attendance summary (last 6 months)</h3>${att}<h3>Leave records</h3>${lv}<p class=mu>Date-wise punches are on the Attendance page; use Previous to go back by month.</p><button class=b onclick="pr(S.rep)">Download report (PDF)</button><button class="b g" onclick="go('att')">Date-wise attendance</button>`};
V.notif=()=>{const u=me(),N=D.notifs.filter(n=>n.to==u.id);return`<h2>Notifications & Alerts</h2><button class="b g" onclick="D.notifs.forEach(n=>{if(n.to=='${u.id}')n.read=true});save();render()">Mark all as read</button>${tbl(['Date','Message',''],N.map(n=>tr([n.date,(n.read?'':'<b>')+esc(n.text)+(n.read?'':'</b>'),n.read?'':'New'])))}`};
V.orders=()=>{const q=S.q.toLowerCase(),L=D.orders.filter(o=>(S.cat=='All'||o.cat==S.cat)&&(o.title+o.subject+o.unit).toLowerCase().includes(q)).sort((a,b)=>b.date.localeCompare(a.date));
return`<h2>Office Orders & Circulars</h2><div class=row><div><label>Search</label><input value="${esc(S.q)}" oninput="S.q=this.value;render();const i=document.querySelector('main input');i.focus();i.setSelectionRange(99,99)"></div><div><label>Location</label><select onchange="S.cat=this.value;render()">${['All','Head Office','Mines','Units'].map(c=>`<option ${c==S.cat?'selected':''}>${c}</option>`).join('')}</select></div></div><br>${tbl(['Date','Title','Subject','Location','Unit',''],L.map(o=>tr([o.date,esc(o.title)+tag(o.src),o.subject,o.cat,esc(o.unit),`<button class="b sm" onclick="openOrder('${o.id}')">View</button>`])))}`};
function openOrder(id){const o=D.orders.find(x=>x.id==id);S.ord=`<h3>${esc(o.title)}</h3><p>${o.subject} · ${o.cat}, ${esc(o.unit)} · ${o.date}</p><p>${esc(o.body)}</p>`;S.modal=`<div class=ov><div class=card>${S.ord}<button class=b onclick="pr(S.ord)">Download PDF</button><button class="b g" onclick="S.modal=null;render()">Close</button></div></div>`;render()}
/* ---- Admin ---- */
V.ahome=()=>{const A=(v,t,n)=>`<button class=tile onclick="go('${v}')"><b>${t}</b><small>${n}</small></button>`;return`<h2>Administrator Dashboard</h2><div class=grid>${A('aemp','Employees & Permissions',D.users.length+' accounts')}${A('aslip','Upload Salary Slip',D.slips.length+' slips')}${A('aleave','Leave Policy & Balances','')}${A('acorr','Attendance Corrections',D.corr.filter(c=>c.status=='Pending').length+' pending')}${A('aord','Upload Order / Circular',D.orders.length+' documents')}${A('anot','Send Notification','')}${A('alog','Activity Log',D.logs.length+' entries')}</div>`};
const opts=()=>D.users.map(u=>`<option value=${u.id}>${u.id} · ${esc(u.name)}</option>`).join('');
V.aemp=()=>`<h2>Employees & Permissions</h2>${tbl(['ID','Name','Designation','Unit','Role','Status'],D.users.map(u=>tr([u.id,esc(u.name),esc(u.desig),esc(u.unit),`<select onchange="setRole('${u.id}',this.value)">${['employee','officer','admin'].map(r=>`<option ${r==u.role?'selected':''}>${r}</option>`).join('')}</select>`,`<button class="b sm ${u.active?'r':''}" onclick="toggleU('${u.id}')">${u.active?'Disable':'Enable'}</button>`])))}<div class=card><h3 style=margin-top:0>Add employee account</h3><form onsubmit="addU(event)"><div class=row><div><label>Employee ID<input name=id required></label></div><div><label>Name<input name=name required></label></div><div><label>Designation<input name=desig required></label></div><div><label>Department<input name=dept required></label></div><div><label>Unit<input name=unit required></label></div><div><label>Date of birth<input type=date name=dob required></label></div><div><label>Basic pay<input type=number name=basic required></label></div><div><label>Reporting officer ID<input name=rep></label></div></div><button class=b>Create account</button><p class=mu>New accounts get the temporary password Welcome@123.</p></form></div>`;
function setRole(id,r){usr(id).role=r;log(`Changed role of ${id} to ${r}`);toast('Role updated.');render()}
function toggleU(id){if(id==S.u)return toast('You cannot disable your own account.');const u=usr(id);u.active=!u.active;log(`${u.active?'Enabled':'Disabled'} account ${id}`);render()}
function addU(e){const f=fd(e);f.id=f.id.trim().toUpperCase();if(D.users.some(u=>u.id==f.id))return toast('That Employee ID already exists.');D.users.push({...f,basic:+f.basic,rep:f.rep||null,role:'employee',pw:'Welcome@123',active:true,doj:TK});D.bal[f.id]={...D.policy};log('Created account '+f.id);toast('Account created.');render()}
V.aslip=()=>`<h2>Upload Salary Slip</h2><div class=card><form onsubmit="upSlip(event)"><div class=row><div><label>Employee<select name=emp>${opts()}</select></label></div><div><label>Month<input type=month name=mo required></label></div><div><label>Basic pay<input type=number name=basic required></label></div><div><label>Pay level<input name=level value="Level 10"></label></div><div><label>DA<input type=number name=da value=0></label></div><div><label>HRA<input type=number name=hra value=0></label></div><div><label>Other allowances<input type=number name=oa value=0></label></div><div><label>Provident fund<input type=number name=pf value=0></label></div><div><label>Income tax<input type=number name=tax value=0></label></div><div><label>Other deductions<input type=number name=od value=0></label></div></div><button class=b>Publish slip</button><p class=mu>Saving again for the same employee and month replaces the slip. In production this form is replaced by a payroll API feed.</p></form></div>`;
function upSlip(e){const f=fd(e),[y,m]=f.mo.split('-').map(Number),n=k=>+f[k];const s=mkSlip(f.emp,y,m-1,n('basic'),'hr',{level:f.level,da:n('da'),hra:n('hra'),oa:n('oa'),pf:n('pf'),tax:n('tax'),od:n('od')});D.slips=D.slips.filter(x=>!(x.emp==f.emp&&x.y==y&&x.m==m-1));D.slips.push(s);notify(f.emp,`Salary slip for ${ml(y,m-1)} is available.`);log(`Uploaded slip ${f.emp} ${ml(y,m-1)}`);toast('Slip published.');render()}
V.aleave=()=>`<h2>Leave Policy & Balances</h2><div class=card><h3 style=margin-top:0>Default yearly entitlement for new accounts</h3><form onsubmit="setPol(event)"><div class=row>${Object.keys(LT).map(t=>`<div><label>${LT[t]}<input type=number name=${t} value=${D.policy[t]} min=0></label></div>`).join('')}</div><button class=b>Save policy</button></form></div><div class=card><h3 style=margin-top:0>Adjust an employee's balance</h3><form onsubmit="setBal(event)"><div class=row><div><label>Employee<select name=emp>${opts()}</select></label></div><div><label>Leave type<select name=type>${Object.keys(LT).map(t=>`<option value=${t}>${LT[t]}</option>`).join('')}</select></label></div><div><label>New entitlement (days)<input type=number name=n min=0 required></label></div></div><button class=b>Update balance</button></form></div>${tbl(['Employee',...Object.values(LT)],D.users.map(u=>tr([esc(u.name),...Object.keys(LT).map(t=>avail(u.id,t)+' / '+D.bal[u.id][t])])))}`;
function setPol(e){const f=fd(e);Object.keys(LT).forEach(t=>D.policy[t]=+f[t]);log('Updated leave policy');toast('Policy saved.');render()}
function setBal(e){const f=fd(e);D.bal[f.emp][f.type]=+f.n;notify(f.emp,`Leave balance updated: ${LT[f.type]} entitlement is now ${f.n} day(s).`);log(`Set ${f.type} for ${f.emp} to ${f.n}`);toast('Balance updated.');render()}
V.acorr=()=>`<h2>Attendance Corrections</h2>${tbl(['Employee','Date','IN','OUT','Reason','Status',''],D.corr.map(c=>tr([esc(usr(c.emp).name),c.date,c.in,c.out,esc(c.reason),chip(c.status),c.status=='Pending'?`<button class="b sm" onclick="fix('${c.id}','Approved')">Approve</button><button class="b sm r" onclick="fix('${c.id}','Rejected')">Reject</button>`:''])))}`;
function fix(id,st){const c=D.corr.find(x=>x.id==id);c.status=st;if(st=='Approved')D.fix[c.emp+c.date]={in:pm(c.in),out:pm(c.out)};notify(c.emp,`Your attendance correction for ${c.date} was ${st.toLowerCase()}.`);log(`${st} correction ${c.emp} ${c.date}`);render()}
V.aord=()=>`<h2>Upload Order / Circular</h2><div class=card><form onsubmit="upOrd(event)"><label>Title<input name=title required></label><div class=row><div><label>Subject<select name=subject>${['Office Order','Circular','HR Policy','Safety','Announcement'].map(s=>`<option>${s}</option>`).join('')}</select></label></div><div><label>Location<select name=cat>${['Head Office','Mines','Units'].map(s=>`<option>${s}</option>`).join('')}</select></label></div><div><label>Unit / mine<input name=unit required></label></div></div><label>Content<textarea name=body rows=4 required></textarea></label><button class=b>Publish and notify everyone</button><p class=mu>In production, attach the PDF from the document management system.</p></form></div>`;
function upOrd(e){const f=fd(e);D.orders.push({id:'O'+Date.now(),...f,date:TK,src:'hr'});notify('all',`New ${f.subject.toLowerCase()}: ${f.title}`);log('Uploaded document: '+f.title);toast('Published.');render()}
V.anot=()=>`<h2>Send Notification</h2><div class=card><form onsubmit="sendN(event)"><label>Send to<select name=to><option value=all>All active employees</option>${opts()}</select></label><label>Message<textarea name=msg rows=3 required></textarea></label><button class=b>Send</button></form></div>`;
function sendN(e){const f=fd(e);notify(f.to,'HR announcement: '+f.msg);log('Sent notification to '+f.to);toast('Notification sent.');e.target.reset()}
V.alog=()=>`<h2>Activity Log</h2>${tbl(['Time','Administrator','Action'],D.logs.map(l=>tr([l.t,l.by,esc(l.txt)])))}<button class="b g" onclick="if(confirm('Reset all sample data?')){localStorage.removeItem(KEY);D=seed();S.u=null;render()}">Reset sample data</button>`;
render();
</script></body></html>
